<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Event</title>
    <style>
        
    </style>
</head>
<body>
    <h1>Dom Events</h1>
    <button id="btn">Click</button>

</body>
<script>
    const btn = document.querySelector("#btn")
    console.log(btn)

    btn.addEventListener("Click", ()=>{
        alert("Button Clicked")
    })
</script>
</html>
